name: tfsec
permissions:
  contents: read
  security-events: write
  pull-requests: write
on:
  pull_request:
    paths:
      - '**/*.tf'
      - '*.tf'
  workflow_dispatch:
jobs:
  tfsec:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/security-tfsec.yml@v2
    secrets: inherit
    with:
      working_directory: '.'
